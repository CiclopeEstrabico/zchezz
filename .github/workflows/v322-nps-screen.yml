name: v322-nps-screen

on:
  workflow_dispatch:
  push:
    branches: [v322-nps-strength]
    paths:
      - 'tools/v322_apply_candidate.py'
      - '.github/workflows/v322-nps-screen.yml'

permissions:
  contents: read

jobs:
  candidate:
    name: v322-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [quiet_see, premake_futility, extcache16, extcache64, extra_fixedpoint]
    env:
      STATIC_FLAG: ''
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check python-chess

      - name: Prepare isolated baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          cp -a engine/c/zchezz_v321 engine/c/zchezz_v322base
          cp -a engine/c/zchezz_v321 engine/c/zchezz_v322cand
          python tools/v322_apply_candidate.py "$VARIANT" --root engine/c/zchezz_v322cand
          mkdir -p "artifacts/v322/$VARIANT"
          diff -ur engine/c/zchezz_v322base engine/c/zchezz_v322cand > "artifacts/v322/$VARIANT/patch.diff" || true
          test -s "artifacts/v322/$VARIANT/patch.diff"

      - name: Build AVX2 reference binaries
        shell: bash
        run: |
          set -euo pipefail
          ARCH_FLAGS="-mavx2" make -C engine/build ENGINE=v322base clean native
          ARCH_FLAGS="-mavx2" make -C engine/build ENGINE=v322cand clean native
          ARCH_FLAGS="-mavx2" make -C engine/build ENGINE=v403 arena

      - name: Repeated bench
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            engine/c/zchezz_v322base/zchezz.exe bench 11 | tee -a "artifacts/v322/$VARIANT/bench_base.txt"
            engine/c/zchezz_v322cand/zchezz.exe bench 11 | tee -a "artifacts/v322/$VARIANT/bench_candidate.txt"
          done

      - name: UCI sanity
        shell: bash
        run: |
          set -euo pipefail
          printf 'uci\nisready\nposition startpos\ngo nodes 20000\n' | timeout 30s engine/c/zchezz_v322base/zchezz.exe > /tmp/base.txt
          printf 'uci\nisready\nposition startpos\ngo nodes 20000\n' | timeout 30s engine/c/zchezz_v322cand/zchezz.exe > /tmp/cand.txt
          grep -q 'bestmove ' /tmp/base.txt
          grep -q 'bestmove ' /tmp/cand.txt

      - name: Generate paired openings
        shell: bash
        run: |
          python - <<'PY'
          import random, chess
          from pathlib import Path
          rng=random.Random(3222026); rows=[]; seen=set()
          while len(rows)<256:
              b=chess.Board(); ok=True
              for _ in range(rng.randint(8,20)):
                  moves=list(b.legal_moves)
                  if not moves: ok=False; break
                  quiet=[m for m in moves if not b.is_capture(m)]
                  b.push(rng.choice(quiet if quiet and rng.random()<0.76 else moves))
                  if b.is_game_over(claim_draw=True): ok=False; break
              if not ok: continue
              k=' '.join(b.fen().split()[:4])
              if k not in seen: seen.add(k); rows.append(k)
          Path('openings_v322.epd').write_text('\n'.join(rows)+'\n')
          PY

      - name: Fixed-node quality/identity gate
        shell: bash
        run: |
          set -euo pipefail
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v322cand/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v322base/zchezz.exe" \
            --games 256 --threads 4 --movetime 0 --nodes 20000 --max-plies 220 \
            --openings openings_v322.epd --opening-plies 0 --seed 3222026 --tt-mb 16 \
            --json "artifacts/v322/$VARIANT/fixed_20kn.json" \
            --pgn "artifacts/v322/$VARIANT/fixed_20kn.pgn"

      - name: Timed Elo screen
        shell: bash
        run: |
          set -euo pipefail
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v322cand/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v322base/zchezz.exe" \
            --games 512 --threads 4 --movetime 20 --max-plies 240 \
            --openings openings_v322.epd --opening-plies 0 --seed 3222026 --tt-mb 16 \
            --json "artifacts/v322/$VARIANT/timed_20ms.json" \
            --pgn "artifacts/v322/$VARIANT/timed_20ms.pgn"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: v322-${{ matrix.variant }}-screen
          path: artifacts/v322/${{ matrix.variant }}/
          if-no-files-found: error
