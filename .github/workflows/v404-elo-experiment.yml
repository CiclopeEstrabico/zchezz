name: v404-elo-experiment

on:
  push:
    branches: ["v404-elo-recovery"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-v314-pgo:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      STATIC_FLAG: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install opening generator dependency
        run: python -m pip install --disable-pip-version-check python-chess

      - name: Prove v404 playing code is identical to v314
        run: |
          set -euo pipefail
          for f in main.c board.c board.h search.c search.h nnue.c nnue.h nnue_weights.bin book.c book.h poly_keys.h stdendian.h syzygy.c syzygy.h tbconfig.h; do
            cmp "engine/c/zchezz_v314/$f" "engine/c/zchezz_v404/$f"
          done
          echo "v404 source/eval policy is byte-identical to v314"

      - name: Build stock v314 baseline
        run: |
          ARCH_FLAGS="-mavx2" make -C engine/build ENGINE=v314 clean native
          mkdir -p artifacts/v404
          engine/c/zchezz_v314/zchezz.exe bench 11 | tee artifacts/v404/bench_v314_stock.txt

      - name: Train and build PGO+LTO v404
        run: |
          set -euo pipefail
          rm -rf /tmp/zchezz-pgo
          mkdir -p /tmp/zchezz-pgo

          # Instrument the exact v3.14 code. Native tuning is safe here because
          # both engines execute on the same runner CPU; this experiment asks
          # whether code-generation alone can turn the same policy into Elo.
          ARCH_FLAGS="-mavx2 -march=native -mtune=native -flto -fprofile-generate=/tmp/zchezz-pgo" \
            make -C engine/build ENGINE=v404 clean native

          # Exercise the same hot paths used in play across several depths so
          # profile data is not dominated by one particular tree size.
          engine/c/zchezz_v404/zchezz.exe bench 8  >/dev/null
          engine/c/zchezz_v404/zchezz.exe bench 10 >/dev/null
          engine/c/zchezz_v404/zchezz.exe bench 12 >/dev/null

          ARCH_FLAGS="-mavx2 -march=native -mtune=native -flto -fprofile-use=/tmp/zchezz-pgo -fprofile-correction -fomit-frame-pointer" \
            make -C engine/build ENGINE=v404 clean native

          engine/c/zchezz_v404/zchezz.exe bench 11 | tee artifacts/v404/bench_v404_pgo.txt

      - name: Build shared arena
        run: ARCH_FLAGS="-mavx2" make -C engine/build ENGINE=v403 arena

      - name: UCI sanity
        run: |
          set -euo pipefail
          printf 'uci\nisready\nposition startpos\ngo nodes 20000\n' | timeout 30s engine/c/zchezz_v314/zchezz.exe | tee /tmp/v314_uci.txt
          printf 'uci\nisready\nposition startpos\ngo nodes 20000\n' | timeout 30s engine/c/zchezz_v404/zchezz.exe | tee /tmp/v404_uci.txt
          grep -q 'bestmove ' /tmp/v314_uci.txt
          grep -q 'bestmove ' /tmp/v404_uci.txt

      - name: Generate deterministic paired opening pool
        run: |
          python - <<'PY'
          import hashlib, random
          import chess
          from pathlib import Path

          rng = random.Random(4042026)
          out = Path('artifacts/v404/openings.epd')
          seen, rows = set(), []
          while len(rows) < 256:
              b = chess.Board()
              target = rng.randint(8, 18)
              ok = True
              for _ in range(target):
                  moves = list(b.legal_moves)
                  if not moves:
                      ok = False
                      break
                  quiet = [m for m in moves if not b.is_capture(m)]
                  pool = quiet if quiet and rng.random() < 0.78 else moves
                  b.push(rng.choice(pool))
                  if b.is_game_over(claim_draw=True):
                      ok = False
                      break
              if not ok:
                  continue
              key = ' '.join(b.fen().split()[:4])
              if key not in seen:
                  seen.add(key)
                  rows.append(key)
          out.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          print(f'openings={len(rows)} sha256={hashlib.sha256(out.read_bytes()).hexdigest()}')
          PY

      - name: Exact-policy fixed-node identity gate
        run: |
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v404/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v314/zchezz.exe" \
            --games 64 --threads 4 --movetime 0 --nodes 20000 --max-plies 220 \
            --openings artifacts/v404/openings.epd --opening-plies 0 \
            --seed 4042026 --tt-mb 16 \
            --json artifacts/v404/identity_20kn.json \
            --pgn artifacts/v404/identity_20kn.pgn

      - name: Timed H2H screening (20 ms/move)
        run: |
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v404/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v314/zchezz.exe" \
            --games 512 --threads 4 --movetime 20 --max-plies 240 \
            --openings artifacts/v404/openings.epd --opening-plies 0 \
            --seed 4042026 --tt-mb 16 \
            --json artifacts/v404/h2h_pgo_20ms.json \
            --pgn artifacts/v404/h2h_pgo_20ms.pgn

      - name: Timed H2H confirmation (100 ms/move)
        run: |
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v404/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v314/zchezz.exe" \
            --games 192 --threads 4 --movetime 100 --max-plies 240 \
            --openings artifacts/v404/openings.epd --opening-plies 0 \
            --seed 4042026 --tt-mb 16 \
            --json artifacts/v404/h2h_pgo_100ms.json \
            --pgn artifacts/v404/h2h_pgo_100ms.pgn

      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v404-pgo-elo-evidence
          path: artifacts/v404/
          if-no-files-found: warn
