name: v404-elo-experiment

on:
  push:
    branches: ["v404-elo-recovery"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hybrid-strength:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ARCH_FLAGS: -mavx2
      STATIC_FLAG: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install opening generator dependency
        run: python -m pip install --disable-pip-version-check python-chess

      - name: Build v3.14 baseline, v4.04 hybrid and shared arena
        run: |
          make -C engine/build ENGINE=v314 native
          make -C engine/build ENGINE=v404 native
          make -C engine/build ENGINE=v403 arena

      - name: UCI sanity
        run: |
          set -euo pipefail
          printf 'uci\nisready\nposition startpos\ngo depth 5\nquit\n' | timeout 30s engine/c/zchezz_v314/zchezz.exe | tee /tmp/v314_uci.txt
          printf 'uci\nisready\nposition startpos\ngo depth 5\nquit\n' | timeout 30s engine/c/zchezz_v404/zchezz.exe | tee /tmp/v404_uci.txt
          grep -q 'bestmove ' /tmp/v314_uci.txt
          grep -q 'bestmove ' /tmp/v404_uci.txt
          ! grep -q 'bestmove 0000' /tmp/v404_uci.txt

      - name: Bench both engines
        run: |
          mkdir -p artifacts/v404
          engine/c/zchezz_v314/zchezz.exe bench 10 | tee artifacts/v404/bench_v314.txt
          engine/c/zchezz_v404/zchezz.exe bench 10 | tee artifacts/v404/bench_v404.txt

      - name: Generate deterministic paired opening pool
        run: |
          python - <<'PY'
          import hashlib, random
          import chess
          from pathlib import Path

          rng = random.Random(4042026)
          out = Path('artifacts/v404/openings.epd')
          out.parent.mkdir(parents=True, exist_ok=True)
          seen = set()
          rows = []
          while len(rows) < 192:
              b = chess.Board()
              target = rng.randint(8, 16)
              ok = True
              for _ in range(target):
                  moves = list(b.legal_moves)
                  if not moves:
                      ok = False
                      break
                  # Mildly prefer non-captures in the first few plies so the pool
                  # contains opening-like positions rather than tactical wreckage.
                  quiet = [m for m in moves if not b.is_capture(m)]
                  choice_pool = quiet if quiet and rng.random() < 0.78 else moves
                  b.push(rng.choice(choice_pool))
                  if b.is_game_over(claim_draw=True):
                      ok = False
                      break
              if not ok:
                  continue
              key = ' '.join(b.fen().split()[:4])
              if key in seen:
                  continue
              seen.add(key)
              rows.append(key)
          out.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          print(f'openings={len(rows)} sha256={digest}')
          PY

      - name: Fast paired H2H gate (20 ms/move)
        run: |
          python tests/run_arena.py \
            --player uci:engine/c/zchezz_v404/zchezz.exe \
            --player uci:engine/c/zchezz_v314/zchezz.exe \
            --games 384 --threads 4 --movetime 20 --max-plies 260 \
            --openings artifacts/v404/openings.epd --opening-plies 0 \
            --seed 4042026 --tt-mb 16 \
            --json artifacts/v404/h2h_20ms.json \
            --pgn artifacts/v404/h2h_20ms.pgn

      - name: Medium paired H2H gate (100 ms/move)
        run: |
          python tests/run_arena.py \
            --player uci:engine/c/zchezz_v404/zchezz.exe \
            --player uci:engine/c/zchezz_v314/zchezz.exe \
            --games 192 --threads 4 --movetime 100 --max-plies 260 \
            --openings artifacts/v404/openings.epd --opening-plies 0 \
            --seed 4042026 --tt-mb 16 \
            --json artifacts/v404/h2h_100ms.json \
            --pgn artifacts/v404/h2h_100ms.pgn

      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v404-elo-evidence
          path: artifacts/v404/
          if-no-files-found: warn
