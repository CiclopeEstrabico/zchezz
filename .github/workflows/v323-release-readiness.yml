name: v323-release-readiness

on:
  workflow_dispatch:
  push:
    branches: [v323-release-candidate]

permissions:
  contents: read

jobs:
  linux-full:
    runs-on: ubuntu-24.04
    env:
      ARCH_FLAGS: -mavx2
      STATIC_FLAG: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e ".[all]"
      - name: Active release contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < engine/ACTIVE_ENGINE)" = v323
          test -d engine/c/zchezz_v323
          python - <<'PY'
          from utils.repo_paths import active_version, engine_dir
          assert active_version() == 'v323'
          assert engine_dir().name == 'zchezz_v323'
          PY
      - name: GCC release build and C invariants
        shell: bash
        run: |
          set -euo pipefail
          make -C engine/build ENGINE=v323 clean native
          make -C engine/build ENGINE=v323 test-c
      - name: Clang release build
        shell: bash
        run: |
          set -euo pipefail
          make -C engine/build ENGINE=v323 clean native CC=clang
          printf 'uci\nisready\nquit\n' | engine/c/zchezz_v323/zchezz.exe --nnue engine/c/zchezz_v323/nnue_weights.bin | tee /tmp/clang-uci.log
          grep -q 'id name Zchezz 3.23' /tmp/clang-uci.log
          grep -q readyok /tmp/clang-uci.log
      - name: Restore GCC release build
        shell: bash
        run: make -C engine/build ENGINE=v323 clean native CC=gcc
      - name: Full perft and UCI suites
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_perft.py --version v323
          python tests/test_uci_extended.py --version v323
      - name: Canonical full regression suite
        shell: bash
        run: python tests/run_tests.py full --version v323 --baseline v322 --keep-going
      - name: Fixed-tree parity against v3.22
        shell: bash
        run: |
          set -euo pipefail
          make -C engine/build ENGINE=v322 clean native CC=gcc
          make -C engine/build ENGINE=v323 clean native CC=gcc
          python - <<'PY'
          import subprocess,re
          def bench(exe,weights):
              p=subprocess.run([exe,'--nnue',weights,'bench','11'],capture_output=True,text=True,check=True)
              text=p.stdout+p.stderr
              nodes=int(re.search(r'Total nodes\s*:\s*(\d+)',text).group(1))
              rows=re.findall(r'Position\s+\d+:\s+depth=\s*(\d+)\s+nodes=\s*(\d+)\s+best=(\S+)\s+score=(-?\d+)',text)
              return nodes,rows
          a=bench('engine/c/zchezz_v322/zchezz.exe','engine/c/zchezz_v322/nnue_weights.bin')
          b=bench('engine/c/zchezz_v323/zchezz.exe','engine/c/zchezz_v323/nnue_weights.bin')
          assert a==b,(a,b)
          assert a[0]==3735321,a[0]
          print('EXACT_TREE_PARITY',a[0],len(a[1]))
          PY
      - name: Shared native tools compile
        shell: bash
        run: |
          set -euo pipefail
          make -C engine/build TOOLS_ENGINE=v403 arena
          make -C engine/build TOOLS_ENGINE=v403 selfplay
          make -C engine/build TOOLS_ENGINE=v403 ga_tune

  sanitize-tsan:
    runs-on: ubuntu-24.04
    env:
      ARCH_FLAGS: -mavx2
      STATIC_FLAG: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          make -C engine/build ENGINE=v323 sanitize
          python tests/test_uci_extended.py --exe engine/c/zchezz_v323/zchezz_sanitize.exe --only T1 --only T2 --only T6 --only T9
      - name: TSan PK17 multithread stress
        shell: bash
        env:
          TSAN_OPTIONS: halt_on_error=1:history_size=7
        run: |
          set -euo pipefail
          git fetch origin v323-fullacc-endgame-test
          git show origin/v323-fullacc-endgame-test:engine/c/tests/test_v323_pk17_mt.c > /tmp/test_v323_pk17_mt.c
          gcc -O1 -g -fno-omit-frame-pointer -fsanitize=thread \
            -D_GNU_SOURCE -std=c11 -Iengine/c/zchezz_v323 \
            -o /tmp/pk17_tsan /tmp/test_v323_pk17_mt.c \
            engine/c/zchezz_v323/board.c engine/c/zchezz_v323/nnue.c \
            -lm -pthread -fsanitize=thread
          /tmp/pk17_tsan engine/c/zchezz_v323/nnue_weights.bin

  windows-mingw:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure MinGW and dependencies
        shell: pwsh
        run: |
          if (-not (Get-Command gcc.exe -ErrorAction SilentlyContinue)) { choco install mingw --no-progress -y }
          python -m pip install --disable-pip-version-check python-chess
          gcc --version
      - name: Build Windows AVX2 release
        shell: pwsh
        run: |
          gcc -O3 -ffast-math -D_GNU_SOURCE -std=c11 -mavx2 `
            -Iengine/c/zchezz_v323 -DNO_TABLEBASES `
            -Wno-unused-variable -Wno-unused-but-set-variable -Wno-maybe-uninitialized `
            -Wno-misleading-indentation -Wno-sign-compare -Wno-unused-function -Wno-parentheses `
            -o engine/c/zchezz_v323/zchezz.exe `
            engine/c/zchezz_v323/main.c engine/c/zchezz_v323/board.c `
            engine/c/zchezz_v323/search.c engine/c/zchezz_v323/nnue.c `
            engine/c/zchezz_v323/syzygy.c engine/c/zchezz_v323/book.c `
            -lm -pthread
      - name: Windows perft and UCI
        shell: pwsh
        run: |
          python tests/test_perft.py --version v323 --max-depth 4
          python tests/test_uci_extended.py --version v323 --only T1 --only T2 --only T6 --only T9

  wasm-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Install browser dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check python-chess pytest playwright
          python -m playwright install --with-deps chromium
      - name: WASM compile and bundle
        shell: bash
        run: |
          set -euo pipefail
          make -C engine/build ENGINE=v323 clean bundle
          test -s engine/c/zchezz_v323/zchezz_wasm.js
          test -s engine/c/zchezz_v323/zchezz_wasm.wasm
          test -s engine/c/zchezz_v323/zchezz_bundle.html
          python tests/test_browser_html.py --html engine/c/zchezz_v323/zchezz_bundle.html
          python tests/test_book.py --html engine/c/zchezz_v323/zchezz_bundle.html --evaluate false --write-cleaned false
      - name: Browser runtime E2E
        run: python tests/test_browser.py --version v323 --html zchezz_bundle.html --headless
