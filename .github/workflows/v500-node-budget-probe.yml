name: v500 fixed-node latency probe

on:
  push:
    branches: [v500-strength]
    paths:
      - '.github/workflows/v500-node-budget-probe.yml'
      - 'tests/uci_node_budget_probe.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH_FLAGS: -mavx2
  STATIC_FLAG: ''

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check python-chess
          python -c 'import torch; print(torch.__version__)' || python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Materialize exact 64x32
        run: |
          mkdir -p artifacts/node-budget
          python train/v500_exact_compress.py \
            --base-nnu4 engine/c/zchezz_v500/nnue_weights.bin \
            --dst artifacts/node-budget/bootstrap.pt --h1 64 --seed 806064
          python train/v500_arch_sweep.py export \
            --ckpt artifacts/node-budget/bootstrap.pt \
            --dst artifacts/node-budget/weights.bin --h1 64 --h2 32
          python train/v500_arch_sweep.py materialize-engine \
            --base-engine engine/c/zchezz_v500 \
            --dst-engine engine/c/zchezz_vx64x32 \
            --weights artifacts/node-budget/weights.bin --h1 64 --h2 32
      - name: Build engines
        run: |
          make -C engine/build ENGINE=vx64x32 clean native
          make -C engine/build ENGINE=v500 clean native
          make -C engine/build ENGINE=v314 clean native
      - name: Measure fixed-node wall time
        run: |
          python tests/uci_node_budget_probe.py \
            --engine exact64=$GITHUB_WORKSPACE/engine/c/zchezz_vx64x32/zchezz.exe \
            --engine v500=$GITHUB_WORKSPACE/engine/c/zchezz_v500/zchezz.exe \
            --engine v314=$GITHUB_WORKSPACE/engine/c/zchezz_v314/zchezz.exe \
            --budgets 10000,25000,50000,100000,200000,400000 \
            --positions 64 --seed 806300 --hash-mb 16 \
            --json artifacts/node-budget/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: v500-node-budget-probe
          path: artifacts/node-budget/
          retention-days: 30
