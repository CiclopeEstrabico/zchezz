name: v500-qsearch-tt-ablation

on:
  push:
    branches: ["v500-strength"]
    paths:
      - ".github/workflows/v500-qsearch-tt-ablation.yml"

permissions:
  contents: read

jobs:
  ablate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ARCH_FLAGS: -mavx2
      STATIC_FLAG: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check python-chess
      - name: Materialize v3.14 qsearch-TT policy
        run: |
          rm -rf engine/c/zchezz_qsnott
          cp -a engine/c/zchezz_v500 engine/c/zchezz_qsnott
          python - <<'PY'
          from pathlib import Path
          p=Path('engine/c/zchezz_qsnott/search.c')
          s=p.read_text()
          a='''            if (!ss->time_up)\n                tt_store(tt, b->hash, qs_best, 0, TT_LOWER, &best_move_qs, ply, stand);'''
          b='''            if (0 && !ss->time_up)\n                tt_store(tt, b->hash, qs_best, 0, TT_LOWER, &best_move_qs, ply, stand);'''
          assert s.count(a)==1
          s=s.replace(a,b)
          a='if (qs_best > stand && !ss->time_up) {'
          b='if (0 && qs_best > stand && !ss->time_up) {'
          assert s.count(a)==1
          s=s.replace(a,b)
          p.write_text(s)
          PY
      - name: Build and create openings
        run: |
          make -C engine/build ENGINE=v500 native
          make -C engine/build ENGINE=qsnott native
          make -C engine/build ENGINE=v500 arena
          mkdir -p artifacts/qsearch_tt
          python - <<'PY'
          import sys
          sys.path.insert(0,'train')
          import v500_pipeline as p
          p._make_gate_openings(p.ROOT/'artifacts/qsearch_tt/openings.epd',571731,384)
          PY
      - name: Fixed-node A/B
        run: |
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_qsnott/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v500/zchezz.exe" \
            --games 160 --threads 4 --movetime 0 --nodes 50000 --max-plies 300 \
            --openings artifacts/qsearch_tt/openings.epd --opening-plies 0 \
            --seed 572000 --tt-mb 16 \
            --json artifacts/qsearch_tt/vs_v500_nodes.json \
            --pgn artifacts/qsearch_tt/vs_v500_nodes.pgn
      - name: Fixed-time A/B
        run: |
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_qsnott/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v500/zchezz.exe" \
            --games 160 --threads 4 --movetime 100 --nodes 0 --max-plies 300 \
            --openings artifacts/qsearch_tt/openings.epd --opening-plies 0 \
            --seed 572001 --tt-mb 16 \
            --json artifacts/qsearch_tt/vs_v500_time.json \
            --pgn artifacts/qsearch_tt/vs_v500_time.pgn
      - name: Report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for mode in ('nodes','time'):
              p=Path(f'artifacts/qsearch_tt/vs_v500_{mode}.json')
              if p.exists():
                  x=json.loads(p.read_text())['pairings'][0]
                  print(f'{mode}: W/D/L={x["w"]}/{x["d"]}/{x["l"]} Elo={x["elo"]:+.2f} +/-{x["ci95"]:.2f}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v500-qsearch-tt-ablation
          path: artifacts/qsearch_tt/
          retention-days: 30
