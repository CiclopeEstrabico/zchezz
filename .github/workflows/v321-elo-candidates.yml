name: v321-elo-candidates

on:
  workflow_dispatch:
  push:
    branches: [v321-search-strength]
    paths:
      - 'engine/c/zchezz_v321/**'
      - 'tools/v321_apply_candidate.py'
      - 'tools/v321_apply_tt_aos.py'
      - 'tools/v321_apply_futility.py'
      - '.github/workflows/v321-elo-candidates.yml'

permissions:
  contents: read

jobs:
  candidate:
    name: candidate-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [qsearch_tt, ga_margins, tt_aos, futility_pre_make]
    env:
      STATIC_FLAG: ''
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install opening generator dependency
        run: python -m pip install --disable-pip-version-check python-chess

      - name: Create isolated baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          test -d engine/c/zchezz_v321
          cp -a engine/c/zchezz_v321 engine/c/zchezz_v321base
          cp -a engine/c/zchezz_v321 engine/c/zchezz_v321cand
          case "$VARIANT" in
            qsearch_tt|ga_margins)
              python tools/v321_apply_candidate.py "$VARIANT" --root engine/c/zchezz_v321cand
              ;;
            tt_aos)
              python tools/v321_apply_tt_aos.py --root engine/c/zchezz_v321cand
              ;;
            futility_pre_make)
              python tools/v321_apply_futility.py --root engine/c/zchezz_v321cand
              ;;
            *) exit 2 ;;
          esac

      - name: Build baseline and candidate identically
        shell: bash
        run: |
          set -euo pipefail
          ARCH_FLAGS="-mavx2" make -C engine/build ENGINE=v321base clean native
          ARCH_FLAGS="-mavx2" make -C engine/build ENGINE=v321cand clean native
          ARCH_FLAGS="-mavx2" make -C engine/build ENGINE=v403 arena
          mkdir -p "artifacts/v321/$VARIANT"
          engine/c/zchezz_v321base/zchezz.exe bench 11 | tee "artifacts/v321/$VARIANT/bench_base.txt"
          engine/c/zchezz_v321cand/zchezz.exe bench 11 | tee "artifacts/v321/$VARIANT/bench_candidate.txt"

      - name: UCI sanity
        shell: bash
        run: |
          set -euo pipefail
          printf 'uci\nisready\nposition startpos\ngo nodes 20000\n' | timeout 30s engine/c/zchezz_v321base/zchezz.exe > /tmp/base_uci.txt
          printf 'uci\nisready\nposition startpos\ngo nodes 20000\n' | timeout 30s engine/c/zchezz_v321cand/zchezz.exe > /tmp/cand_uci.txt
          grep -q 'bestmove ' /tmp/base_uci.txt
          grep -q 'bestmove ' /tmp/cand_uci.txt

      - name: Generate deterministic paired opening pool
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, random
          from pathlib import Path
          import chess
          rng = random.Random(3212026)
          out = Path('openings_v321.epd')
          seen, rows = set(), []
          while len(rows) < 256:
              b = chess.Board()
              ok = True
              for _ in range(rng.randint(8, 18)):
                  moves = list(b.legal_moves)
                  if not moves:
                      ok = False
                      break
                  quiet = [m for m in moves if not b.is_capture(m)]
                  pool = quiet if quiet and rng.random() < 0.78 else moves
                  b.push(rng.choice(pool))
                  if b.is_game_over(claim_draw=True):
                      ok = False
                      break
              if not ok:
                  continue
              key = ' '.join(b.fen().split()[:4])
              if key not in seen:
                  seen.add(key)
                  rows.append(key)
          out.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          print(f'openings={len(rows)} sha256={hashlib.sha256(out.read_bytes()).hexdigest()}')
          PY

      - name: Fixed-node A/B — search quality
        shell: bash
        run: |
          set -euo pipefail
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v321cand/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v321base/zchezz.exe" \
            --games 256 --threads 4 --movetime 0 --nodes 20000 --max-plies 220 \
            --openings openings_v321.epd --opening-plies 0 \
            --seed 3212026 --tt-mb 16 \
            --json "artifacts/v321/$VARIANT/fixed_20kn.json" \
            --pgn "artifacts/v321/$VARIANT/fixed_20kn.pgn"

      - name: Timed Elo A/B — release strength
        shell: bash
        run: |
          set -euo pipefail
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v321cand/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v321base/zchezz.exe" \
            --games 1024 --threads 4 --movetime 20 --max-plies 240 \
            --openings openings_v321.epd --opening-plies 0 \
            --seed 3212026 --tt-mb 16 \
            --json "artifacts/v321/$VARIANT/timed_20ms.json" \
            --pgn "artifacts/v321/$VARIANT/timed_20ms.pgn"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: v321-${{ matrix.variant }}-elo-evidence
          path: artifacts/v321/${{ matrix.variant }}/
          if-no-files-found: error
