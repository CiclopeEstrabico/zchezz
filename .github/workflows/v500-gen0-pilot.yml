name: v500-gen0-pilot

on:
  workflow_dispatch:
  push:
    branches: ["v500-strength"]
    paths:
      - ".github/workflows/v500-gen0-pilot.yml"

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ARCH_FLAGS: -mavx2
      STATIC_FLAG: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install training dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy pandas pyarrow python-chess
          python -c 'import torch; print(torch.__version__)' || \
            python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu

      - name: Show generation-0 plan
        run: |
          python train/v500_pipeline.py plan \
            --generation 0 --games 2000 --movetime 25 --teacher-nodes 5000 \
            --teacher-rows 20000 --epochs 12 --batch-size 2048 \
            --gate-games 128 --gate-nodes 50000 --gate-movetime 100

      - name: Generate v5 self-play
        run: |
          python train/v500_pipeline.py generate \
            --generation 0 --games 2000 --shards 2 --threads 4 \
            --movetime 25 --multipv 4 --temperature 0.80 --temp-plies 16 \
            --max-plies 300 --seed 500000

      - name: Label 20k positions with v3.14 teacher
        run: |
          python train/v500_pipeline.py label \
            --generation 0 --teacher-nodes 5000 --teacher-rows 20000 \
            --teacher-workers 4 --teacher-shard-rows 5000 \
            --teacher-timeout 30 --seed 500000

      - name: Train generation 0 from current NNU4 warm start
        run: |
          python train/v500_pipeline.py train \
            --generation 0 --epochs 12 --batch-size 2048 --train-workers 4 \
            --val-every 1 --replay-generations 1 --device cpu \
            --result-blend 0.15 --transfer-lr 3e-5 --seed 500000

      - name: Export candidate
        run: python train/v500_pipeline.py export --generation 0

      - name: Gate candidate against v3.14
        run: |
          python train/v500_pipeline.py gate \
            --generation 0 --gate-games 128 --gate-nodes 50000 \
            --gate-movetime 100 --gate-threads 4 --seed 500000

      - name: Build candidate and current v5 for direct delta gate
        run: |
          rm -rf engine/c/zchezz_v500pilot
          cp -a engine/c/zchezz_v500 engine/c/zchezz_v500pilot
          cp artifacts/v500-training/gen00/nnue_weights.bin engine/c/zchezz_v500pilot/nnue_weights.bin
          make -C engine/build ENGINE=v500pilot native
          make -C engine/build ENGINE=v500 native
          make -C engine/build ENGINE=v500 arena

      - name: Candidate vs current v5 at fixed nodes
        run: |
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v500pilot/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v500/zchezz.exe" \
            --games 128 --threads 4 --movetime 0 --nodes 50000 --max-plies 300 \
            --openings artifacts/v500-training/gen00/gate_openings.epd --opening-plies 0 \
            --seed 501000 --tt-mb 16 \
            --json artifacts/v500-training/gen00/candidate_vs_v500_nodes.json \
            --pgn artifacts/v500-training/gen00/candidate_vs_v500_nodes.pgn

      - name: Candidate vs current v5 at fixed time
        run: |
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v500pilot/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v500/zchezz.exe" \
            --games 128 --threads 4 --movetime 100 --nodes 0 --max-plies 300 \
            --openings artifacts/v500-training/gen00/gate_openings.epd --opening-plies 0 \
            --seed 501001 --tt-mb 16 \
            --json artifacts/v500-training/gen00/candidate_vs_v500_time.json \
            --pgn artifacts/v500-training/gen00/candidate_vs_v500_time.pgn

      - name: Summarize gates
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/v500-training/gen00')
          for name in [
              'candidate_vs_v314_nodes.json',
              'candidate_vs_v314_time.json',
              'candidate_vs_v500_nodes.json',
              'candidate_vs_v500_time.json',
          ]:
              p=root/name
              if not p.exists():
                  print(name, 'MISSING')
                  continue
              d=json.loads(p.read_text())
              x=d['pairings'][0]
              print(f"{name}: W/D/L={x['w']}/{x['d']}/{x['l']} Elo={x['elo']:+.2f} +/-{x['ci95']:.2f}")
          PY

      - name: Upload complete generation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v500-gen0-pilot
          path: |
            artifacts/v500-training/gen00/
            checkpoints/v500/gen00/
            data/v500_teacher_v314/gen00/
            data/v500_selfplay/gen00/
          if-no-files-found: warn
          retention-days: 30
