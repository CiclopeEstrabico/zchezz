name: v322-quietsee-sweep
on:
  workflow_dispatch:
  push:
    branches: [v322-nps-strength]
    paths: ['tools/v322_tune_quiet_see.py', '.github/workflows/v322-quietsee-sweep.yml']
permissions: {contents: read}
jobs:
  see:
    name: see-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: {variant: [d3x30, d3x45, d3x75, d4x60]}
    env: {STATIC_FLAG: '', VARIANT: '${{ matrix.variant }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check python-chess
      - name: Prepare and build
        shell: bash
        run: |
          cp -a engine/c/zchezz_v321 engine/c/zchezz_v322base
          cp -a engine/c/zchezz_v321 engine/c/zchezz_v322cand
          python tools/v322_tune_quiet_see.py "$VARIANT" --root engine/c/zchezz_v322cand
          mkdir -p "artifacts/see/$VARIANT"
          ARCH_FLAGS="-mavx2" make -C engine/build ENGINE=v322base clean native
          ARCH_FLAGS="-mavx2" make -C engine/build ENGINE=v322cand clean native
          ARCH_FLAGS="-mavx2" make -C engine/build ENGINE=v403 arena
      - name: Bench
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            engine/c/zchezz_v322base/zchezz.exe bench 11 | tee -a "artifacts/see/$VARIANT/base.txt"
            engine/c/zchezz_v322cand/zchezz.exe bench 11 | tee -a "artifacts/see/$VARIANT/cand.txt"
          done
      - name: Openings
        shell: bash
        run: |
          python - <<'PY'
          import random,chess
          from pathlib import Path
          r=random.Random(3222505);rows=[];seen=set()
          while len(rows)<256:
            b=chess.Board();ok=True
            for _ in range(r.randint(8,20)):
              ms=list(b.legal_moves)
              if not ms:ok=False;break
              q=[m for m in ms if not b.is_capture(m)]
              b.push(r.choice(q if q and r.random()<.76 else ms))
              if b.is_game_over(claim_draw=True):ok=False;break
            if ok:
              k=' '.join(b.fen().split()[:4])
              if k not in seen:seen.add(k);rows.append(k)
          Path('o.epd').write_text('\n'.join(rows)+'\n')
          PY
      - name: Fixed
        shell: bash
        run: |
          python tests/run_arena.py --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v322cand/zchezz.exe" --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v322base/zchezz.exe" --games 256 --threads 4 --movetime 0 --nodes 20000 --max-plies 220 --openings o.epd --opening-plies 0 --seed 3222505 --tt-mb 16 --json "artifacts/see/$VARIANT/fixed.json" --pgn "artifacts/see/$VARIANT/fixed.pgn"
      - name: Timed
        shell: bash
        run: |
          python tests/run_arena.py --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v322cand/zchezz.exe" --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v322base/zchezz.exe" --games 512 --threads 4 --movetime 20 --max-plies 240 --openings o.epd --opening-plies 0 --seed 3222505 --tt-mb 16 --json "artifacts/see/$VARIANT/timed.json" --pgn "artifacts/see/$VARIANT/timed.pgn"
      - uses: actions/upload-artifact@v4
        with: {name: 'v322-see-${{ matrix.variant }}', path: 'artifacts/see/${{ matrix.variant }}/', if-no-files-found: error}
