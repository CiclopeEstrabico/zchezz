name: v321-final-confirmation

on:
  workflow_dispatch:
  push:
    branches: [v321-search-strength]
    paths:
      - 'tools/v321_apply_final_bundle.py'
      - '.github/workflows/v321-final-confirmation.yml'

permissions:
  contents: read

jobs:
  confirm:
    name: final-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        variant: [strong_no_qs, strong_bundle, strong_plus_prefetch]
    env:
      STATIC_FLAG: ''
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install opening generator dependency
        run: python -m pip install --disable-pip-version-check python-chess
      - name: Prepare baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          cp -a engine/c/zchezz_v321 engine/c/zchezz_v321base
          cp -a engine/c/zchezz_v321 engine/c/zchezz_v321cand
          python tools/v321_apply_final_bundle.py "$VARIANT" --root engine/c/zchezz_v321cand
          mkdir -p "artifacts/v321-final/$VARIANT"
          diff -ur engine/c/zchezz_v321base engine/c/zchezz_v321cand > "artifacts/v321-final/$VARIANT/patch.diff" || true
          test -s "artifacts/v321-final/$VARIANT/patch.diff"
      - name: Build identically
        shell: bash
        run: |
          set -euo pipefail
          ARCH_FLAGS="-mavx2" make -C engine/build ENGINE=v321base clean native
          ARCH_FLAGS="-mavx2" make -C engine/build ENGINE=v321cand clean native
          ARCH_FLAGS="-mavx2" make -C engine/build ENGINE=v403 arena
          engine/c/zchezz_v321base/zchezz.exe bench 11 | tee "artifacts/v321-final/$VARIANT/bench_base.txt"
          engine/c/zchezz_v321cand/zchezz.exe bench 11 | tee "artifacts/v321-final/$VARIANT/bench_candidate.txt"
      - name: Generate paired openings
        shell: bash
        run: |
          python - <<'PY'
          import random, chess
          from pathlib import Path
          rng=random.Random(3219001); rows=[]; seen=set()
          while len(rows)<512:
              b=chess.Board(); ok=True
              for _ in range(rng.randint(8,20)):
                  moves=list(b.legal_moves)
                  if not moves: ok=False; break
                  quiet=[m for m in moves if not b.is_capture(m)]
                  b.push(rng.choice(quiet if quiet and rng.random()<0.75 else moves))
                  if b.is_game_over(claim_draw=True): ok=False; break
              if not ok: continue
              k=' '.join(b.fen().split()[:4])
              if k not in seen: seen.add(k); rows.append(k)
          Path('openings_v321_final.epd').write_text('\n'.join(rows)+'\n')
          PY
      - name: Fixed-node confirmation
        shell: bash
        run: |
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v321cand/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v321base/zchezz.exe" \
            --games 256 --threads 4 --movetime 0 --nodes 30000 --max-plies 240 \
            --openings openings_v321_final.epd --opening-plies 0 --seed 3219001 --tt-mb 16 \
            --json "artifacts/v321-final/$VARIANT/fixed_30kn.json" \
            --pgn "artifacts/v321-final/$VARIANT/fixed_30kn.pgn"
      - name: Timed 20ms confirmation
        shell: bash
        run: |
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v321cand/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v321base/zchezz.exe" \
            --games 1024 --threads 4 --movetime 20 --max-plies 240 \
            --openings openings_v321_final.epd --opening-plies 0 --seed 3219001 --tt-mb 16 \
            --json "artifacts/v321-final/$VARIANT/timed_20ms.json" \
            --pgn "artifacts/v321-final/$VARIANT/timed_20ms.pgn"
      - name: Timed 100ms confirmation
        shell: bash
        run: |
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v321cand/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v321base/zchezz.exe" \
            --games 256 --threads 4 --movetime 100 --max-plies 240 \
            --openings openings_v321_final.epd --opening-plies 0 --seed 3219001 --tt-mb 16 \
            --json "artifacts/v321-final/$VARIANT/timed_100ms.json" \
            --pgn "artifacts/v321-final/$VARIANT/timed_100ms.pgn"
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: v321-final-${{ matrix.variant }}-evidence
          path: artifacts/v321-final/${{ matrix.variant }}/
          if-no-files-found: error
