name: v321-selected-fixed

on:
  workflow_dispatch:
  push:
    branches: [v321-search-strength]
    paths:
      - '.github/workflows/v321-selected-fixed.yml'

permissions:
  contents: read

jobs:
  fixed:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STATIC_FLAG: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check python-chess
      - name: Prepare selected candidate
        shell: bash
        run: |
          set -euo pipefail
          cp -a engine/c/zchezz_v321 engine/c/zchezz_v321base
          cp -a engine/c/zchezz_v321 engine/c/zchezz_v321cand
          python tools/v321_apply_final_bundle.py strong_plus_prefetch --root engine/c/zchezz_v321cand
          ARCH_FLAGS="-mavx2" make -C engine/build ENGINE=v321base clean native
          ARCH_FLAGS="-mavx2" make -C engine/build ENGINE=v321cand clean native
          ARCH_FLAGS="-mavx2" make -C engine/build ENGINE=v403 arena
          mkdir -p artifacts/v321-selected-fixed
      - name: Generate openings
        shell: bash
        run: |
          python - <<'PY'
          import random, chess
          from pathlib import Path
          rng=random.Random(3219991); rows=[]; seen=set()
          while len(rows)<256:
              b=chess.Board(); ok=True
              for _ in range(rng.randint(8,20)):
                  moves=list(b.legal_moves)
                  if not moves: ok=False; break
                  quiet=[m for m in moves if not b.is_capture(m)]
                  b.push(rng.choice(quiet if quiet and rng.random()<0.75 else moves))
                  if b.is_game_over(claim_draw=True): ok=False; break
              if not ok: continue
              k=' '.join(b.fen().split()[:4])
              if k not in seen: seen.add(k); rows.append(k)
          Path('openings_v321_selected.epd').write_text('\n'.join(rows)+'\n')
          PY
      - name: Fixed-node 30k
        shell: bash
        run: |
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v321cand/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v321base/zchezz.exe" \
            --games 256 --threads 4 --movetime 0 --nodes 30000 --max-plies 240 \
            --openings openings_v321_selected.epd --opening-plies 0 --seed 3219991 --tt-mb 16 \
            --json artifacts/v321-selected-fixed/result.json \
            --pgn artifacts/v321-selected-fixed/games.pgn
      - uses: actions/upload-artifact@v4
        with:
          name: v321-selected-fixed-evidence
          path: artifacts/v321-selected-fixed/
          if-no-files-found: error
