name: v500-lazy-both-screen

on:
  push:
    branches: ["v500-strength"]
    paths:
      - ".github/workflows/v500-lazy-both-screen.yml"
      - "tools/v500_apply_lazy_both.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ARCH_FLAGS: -mavx2
      STATIC_FLAG: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check python-chess
      - name: Materialize candidate
        run: |
          rm -rf engine/c/zchezz_v500base engine/c/zchezz_v500lazyboth
          cp -a engine/c/zchezz_v500 engine/c/zchezz_v500base
          cp -a engine/c/zchezz_v500 engine/c/zchezz_v500lazyboth
          python tools/v500_apply_lazy_both.py --root engine/c/zchezz_v500lazyboth
          git diff --no-index --check engine/c/zchezz_v500base engine/c/zchezz_v500lazyboth || test $? -eq 1
      - name: Verification build
        run: |
          ARCH_FLAGS="-mavx2 -DNNUE_VERIFY_ACC" make -C engine/build ENGINE=v500lazyboth clean native
          engine/c/zchezz_v500lazyboth/zchezz.exe bench 10
      - name: Normal builds
        run: |
          make -C engine/build ENGINE=v500base clean native
          make -C engine/build ENGINE=v500lazyboth clean native
          make -C engine/build ENGINE=v500 arena
      - name: Deterministic parity and NPS
        run: |
          mkdir -p artifacts/lazy_both
          python - <<'PY'
          import subprocess,re,statistics,json
          def run(exe, depth=11):
              out=subprocess.run([exe,'bench',str(depth)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,check=True,timeout=180).stdout
              pos=[re.sub(r'\s+',' ',x.strip()) for x in out.splitlines() if x.startswith('Position ')]
              m=re.findall(r'(?i)nodes/sec\s*:\s*([0-9,]+)',out)
              if not pos or not m: raise SystemExit(out[-3000:])
              return pos,int(m[-1].replace(',',''))
          for depth in (9,11,12):
              a,_=run('engine/c/zchezz_v500base/zchezz.exe',depth)
              b,_=run('engine/c/zchezz_v500lazyboth/zchezz.exe',depth)
              if a!=b: raise SystemExit(f'bench semantic mismatch depth {depth}')
          vals={'base':[],'both':[]}
          for name in ('base','both','both','base','base','both','both','base'):
              _,v=run(f'engine/c/zchezz_v500{name if name=="base" else "lazyboth"}/zchezz.exe')
              vals[name].append(v)
          d={k:{'runs':v,'median':statistics.median(v),'mean':statistics.mean(v)} for k,v in vals.items()}
          d['ratio']=d['both']['median']/d['base']['median']
          print(json.dumps(d,indent=2))
          open('artifacts/lazy_both/nps.json','w').write(json.dumps(d,indent=2))
          PY
      - name: Openings
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'train')
          import v500_pipeline as p
          p._make_gate_openings(p.ROOT/'artifacts/lazy_both/openings.epd', 690731, 320)
          PY
      - name: Fixed-node identity
        run: |
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v500lazyboth/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v500base/zchezz.exe" \
            --games 192 --threads 4 --movetime 0 --nodes 30000 --max-plies 240 \
            --openings artifacts/lazy_both/openings.epd --opening-plies 0 \
            --seed 691000 --tt-mb 16 --json artifacts/lazy_both/nodes.json
      - name: Timed screen
        run: |
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v500lazyboth/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v500base/zchezz.exe" \
            --games 256 --threads 4 --movetime 20 --nodes 0 --max-plies 240 \
            --openings artifacts/lazy_both/openings.epd --opening-plies 0 \
            --seed 691100 --tt-mb 16 --json artifacts/lazy_both/time20.json
      - name: Summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in sorted(Path('artifacts/lazy_both').glob('*.json')):
              j=json.loads(p.read_text())
              if 'pairings' in j:
                  x=j['pairings'][0]
                  print(f'{p.name}: W/D/L={x["w"]}/{x["d"]}/{x["l"]} Elo={x["elo"]:+.2f} +/-{x["ci95"]:.2f}')
              else:
                  print(p.name, json.dumps(j))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v500-lazy-both-screen
          path: artifacts/lazy_both/
          retention-days: 30
