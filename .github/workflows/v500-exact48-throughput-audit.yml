name: v500-exact48-throughput-audit

on:
  push:
    branches: ["v500-strength"]
    paths:
      - ".github/workflows/v500-exact48-throughput-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      STATIC_FLAG: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy pandas python-chess
          python -c 'import torch; print(torch.__version__)' || \
            python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Materialize exact 48x32
        run: |
          mkdir -p artifacts/exact48-audit
          python train/v500_exact_compress.py \
            --base-nnu4 engine/c/zchezz_v500/nnue_weights.bin \
            --dst artifacts/exact48-audit/bootstrap.pt --h1 48 --seed 804800
          python train/v500_arch_sweep.py export \
            --ckpt artifacts/exact48-audit/bootstrap.pt \
            --dst artifacts/exact48-audit/weights.bin --h1 48 --h2 32
          python train/v500_arch_sweep.py materialize-engine \
            --base-engine engine/c/zchezz_v500 \
            --dst-engine engine/c/zchezz_vx48x32 \
            --weights artifacts/exact48-audit/weights.bin --h1 48 --h2 32
      - name: Build AVX2 engines
        env:
          ARCH_FLAGS: -mavx2
        run: |
          make -C engine/build ENGINE=vx48x32 clean native
          cp engine/c/zchezz_vx48x32/zchezz.exe artifacts/exact48-audit/candidate-avx2.exe
          make -C engine/build ENGINE=v500 clean native
          cp engine/c/zchezz_v500/zchezz.exe artifacts/exact48-audit/v500-avx2.exe
          make -C engine/build ENGINE=v314 clean native
          cp engine/c/zchezz_v314/zchezz.exe artifacts/exact48-audit/v314-avx2.exe
      - name: Build scalar candidate and v5
        env:
          ARCH_FLAGS: ""
        run: |
          make -C engine/build ENGINE=vx48x32 clean native
          cp engine/c/zchezz_vx48x32/zchezz.exe artifacts/exact48-audit/candidate-scalar.exe
          make -C engine/build ENGINE=v500 clean native
          cp engine/c/zchezz_v500/zchezz.exe artifacts/exact48-audit/v500-scalar.exe
      - name: Search parity and alternating throughput
        run: |
          python - <<'PY'
          import subprocess,re,statistics,json
          from pathlib import Path
          root=Path('artifacts/exact48-audit')
          exes={
            'candidate':str(root/'candidate-avx2.exe'),
            'v500':str(root/'v500-avx2.exe'),
            'v314':str(root/'v314-avx2.exe'),
          }
          def bench(exe,depth=11):
              p=subprocess.run([exe,'bench',str(depth)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,check=True,timeout=180)
              positions=[re.sub(r'\s+',' ',x.strip()) for x in p.stdout.splitlines() if x.startswith('Position ')]
              m=re.findall(r'(?i)nodes/sec\s*:\s*([0-9,]+)',p.stdout)
              if not m: raise SystemExit(p.stdout[-3000:])
              return positions,int(m[-1].replace(',',''))
          refs={}
          for name in ('candidate','v500'):
              refs[name],_=bench(exes[name])
          cs,_=bench(str(root/'candidate-scalar.exe'))
          bs,_=bench(str(root/'v500-scalar.exe'))
          parity={
            'candidate_vs_v500_avx2': refs['candidate']==refs['v500'],
            'candidate_vs_v500_scalar': cs==bs,
            'candidate_avx2_vs_scalar': refs['candidate']==cs,
            'v500_avx2_vs_scalar': refs['v500']==bs,
          }
          print('PARITY',json.dumps(parity,indent=2))
          if not all(parity.values()): raise SystemExit('search parity audit failed')
          vals={k:[] for k in exes}
          for k in ['candidate','v500','v314','v314','v500','candidate']*5:
              _,nps=bench(exes[k]); vals[k].append(nps)
          out={k:{'runs':v,'median':statistics.median(v),'mean':statistics.mean(v)} for k,v in vals.items()}
          out['candidate_over_v500']=out['candidate']['median']/out['v500']['median']
          out['candidate_over_v314']=out['candidate']['median']/out['v314']['median']
          out['v500_over_v314']=out['v500']['median']/out['v314']['median']
          out['parity']=parity
          print(json.dumps(out,indent=2)); (root/'audit.json').write_text(json.dumps(out,indent=2))
          PY
      - name: Summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/exact48-audit/audit.json')
          if not p.exists(): print('audit.json MISSING'); raise SystemExit(0)
          x=json.loads(p.read_text())
          print(f"candidate/v500={x['candidate_over_v500']:.4f}")
          print(f"candidate/v314={x['candidate_over_v314']:.4f}")
          print(f"v500/v314={x['v500_over_v314']:.4f}")
          print('parity=',x['parity'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v500-exact48-throughput-audit
          path: artifacts/exact48-audit/
          retention-days: 30
