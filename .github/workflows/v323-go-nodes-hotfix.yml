name: v323 go-nodes hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v323-go-nodes-hotfix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch v3.23 go nodes semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          search = Path('engine/c/zchezz_v323/search.c')
          s = search.read_text(encoding='utf-8')
          old = 'if (ss->nodes >= ss->node_limit || time_up(ss))'
          n = s.count(old)
          if n != 2:
              raise SystemExit(f'expected 2 per-iteration node-limit guards, found {n}')
          s = s.replace(old, 'if (ss->nodes_total >= ss->node_limit || time_up(ss))')
          search.write_text(s, encoding='utf-8')

          main = Path('engine/c/zchezz_v323/main.c')
          m = main.read_text(encoding='utf-8')
          old = '''    } else if (mate > 0) {
        p.max_depth = mate * 2;
        p.time_limit_ms = 0;
    } else if (wtime > 0 || btime > 0) {'''
          new = '''    } else if (mate > 0) {
        p.max_depth = mate * 2;
        p.time_limit_ms = 0;
    } else if (p.node_limit > 0) {
        /* A nodes-only UCI search must not inherit DEFAULT_DEPTH=8.
         * The node budget is the stopping condition; let iterative
         * deepening continue until that budget is exhausted. */
        p.max_depth = MAX_PLY - 1;
        p.time_limit_ms = 0;
    } else if (wtime > 0 || btime > 0) {'''
          if old not in m:
              raise SystemExit('main.c node-only insertion anchor not found')
          m = m.replace(old, new, 1)
          main.write_text(m, encoding='utf-8')
          PY

      - name: Build v3.23 without tablebases
        shell: bash
        run: |
          set -euo pipefail
          cd engine/c/zchezz_v323
          gcc -O3 -ffast-math -D_GNU_SOURCE -DNO_TABLEBASES -std=c11 -mavx2 \
            -o zchezz main.c board.c search.c nnue.c syzygy.c tbprobe.c book.c -lm -pthread

      - name: Verify go nodes is neither depth-8 capped nor iteration-local
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, subprocess, sys, time
          exe = 'engine/c/zchezz_v323/zchezz'
          p = subprocess.Popen([exe, '--nnue', 'engine/c/zchezz_v323/nnue_weights.bin'],
                               stdin=subprocess.PIPE, stdout=subprocess.PIPE,
                               stderr=subprocess.STDOUT, text=True, bufsize=1)
          assert p.stdin and p.stdout
          for cmd in ('uci','isready','position startpos','go nodes 2000000'):
              p.stdin.write(cmd+'\n'); p.stdin.flush()
          max_depth = 0
          last_nodes = 0
          deadline = time.time() + 90
          lines=[]
          while time.time() < deadline:
              line = p.stdout.readline()
              if not line:
                  break
              lines.append(line.rstrip())
              md = re.search(r'\bdepth (\d+)', line)
              mn = re.search(r'\bnodes (\d+)', line)
              if md: max_depth=max(max_depth,int(md.group(1)))
              if mn: last_nodes=max(last_nodes,int(mn.group(1)))
              if line.startswith('bestmove '):
                  break
          p.stdin.write('quit\n'); p.stdin.flush()
          try: p.wait(timeout=5)
          except subprocess.TimeoutExpired: p.kill()
          print('\n'.join(lines[-40:]))
          print('MAX_DEPTH', max_depth, 'LAST_NODES', last_nodes)
          if max_depth <= 8:
              raise SystemExit(f'go nodes still depth-capped: max_depth={max_depth}')
          if last_nodes < 1000000:
              raise SystemExit(f'node budget appears iteration-local/ignored: last_nodes={last_nodes}')
          if last_nodes > 2050000:
              raise SystemExit(f'node budget overshoot too large: last_nodes={last_nodes}')
          PY

      - name: Commit verified hotfix to main
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v323-go-nodes-hotfix.yml
          git add engine/c/zchezz_v323/main.c engine/c/zchezz_v323/search.c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(v323): honor UCI go nodes budget'
          git push origin HEAD:main
