name: v500-exact-48x32-confirm

on:
  push:
    branches: ["v500-strength"]
    paths:
      - ".github/workflows/v500-exact-48x32-confirm.yml"
      - "train/v500_exact_compress.py"
      - "train/v500_arch_sweep.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ARCH_FLAGS: -mavx2
      STATIC_FLAG: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy pandas
          python -c 'import torch; print(torch.__version__)' || \
            python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Materialize exact 48x32
        run: |
          mkdir -p artifacts/exact48-audit
          python train/v500_exact_compress.py \
            --base-nnu4 engine/c/zchezz_v500/nnue_weights.bin \
            --dst artifacts/exact48-audit/bootstrap.pt --h1 48 --seed 804800
          python train/v500_arch_sweep.py export \
            --ckpt artifacts/exact48-audit/bootstrap.pt \
            --dst artifacts/exact48-audit/weights.bin --h1 48 --h2 32
          python train/v500_arch_sweep.py materialize-engine \
            --base-engine engine/c/zchezz_v500 \
            --dst-engine engine/c/zchezz_vx48x32 \
            --weights artifacts/exact48-audit/weights.bin --h1 48 --h2 32
      - name: Build all engines
        run: |
          make -C engine/build ENGINE=vx48x32 clean native
          make -C engine/build ENGINE=v500 clean native
          make -C engine/build ENGINE=v314 clean native
      - name: Deterministic parity and alternating throughput
        run: |
          python - <<'PY'
          import subprocess,re,statistics,json
          from pathlib import Path
          outdir=Path('artifacts/exact48-audit')
          exes={
            'candidate':'engine/c/zchezz_vx48x32/zchezz.exe',
            'v500':'engine/c/zchezz_v500/zchezz.exe',
            'v314':'engine/c/zchezz_v314/zchezz.exe',
          }
          def bench(exe,depth=11):
              p=subprocess.run([exe,'bench',str(depth)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,check=True,timeout=180)
              positions=[re.sub(r'\s+',' ',x.strip()) for x in p.stdout.splitlines() if x.startswith('Position ')]
              m=re.findall(r'(?i)nodes/sec\s*:\s*([0-9,]+)',p.stdout)
              if not m: raise SystemExit(p.stdout[-3000:])
              return positions,int(m[-1].replace(',',''))
          b,_,=bench(exes['v500']); c,_=bench(exes['candidate'])
          parity=(b==c)
          print('deterministic_parity=',parity)
          if not parity: raise SystemExit('exact 48x32 deterministic bench mismatch')
          vals={k:[] for k in exes}
          order=['candidate','v500','v314','v314','v500','candidate']*4
          for k in order:
              _,nps=bench(exes[k]); vals[k].append(nps)
          j={k:{'runs':v,'median':statistics.median(v),'mean':statistics.mean(v)} for k,v in vals.items()}
          j['candidate_over_v500']=j['candidate']['median']/j['v500']['median']
          j['candidate_over_v314']=j['candidate']['median']/j['v314']['median']
          j['v500_over_v314']=j['v500']['median']/j['v314']['median']
          j['deterministic_parity']=parity
          print(json.dumps(j,indent=2)); (outdir/'throughput.json').write_text(json.dumps(j,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v500-exact48-audit
          path: artifacts/exact48-audit/
          retention-days: 30

  gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: nodes-v500
            opponent: v500
            games: 512
            movetime: 0
            nodes: 50000
            seed: 805001
          - tag: nodes-v314
            opponent: v314
            games: 512
            movetime: 0
            nodes: 50000
            seed: 805002
          - tag: time200-v500
            opponent: v500
            games: 512
            movetime: 200
            nodes: 0
            seed: 805003
          - tag: time200-v314
            opponent: v314
            games: 512
            movetime: 200
            nodes: 0
            seed: 805004
    name: ${{ matrix.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      ARCH_FLAGS: -mavx2
      STATIC_FLAG: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy pandas python-chess
          python -c 'import torch; print(torch.__version__)' || \
            python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Materialize exact 48x32
        run: |
          mkdir -p "artifacts/exact48-${{ matrix.tag }}"
          python train/v500_exact_compress.py \
            --base-nnu4 engine/c/zchezz_v500/nnue_weights.bin \
            --dst "artifacts/exact48-${{ matrix.tag }}/bootstrap.pt" --h1 48 --seed 804800
          python train/v500_arch_sweep.py export \
            --ckpt "artifacts/exact48-${{ matrix.tag }}/bootstrap.pt" \
            --dst "artifacts/exact48-${{ matrix.tag }}/weights.bin" --h1 48 --h2 32
          python train/v500_arch_sweep.py materialize-engine \
            --base-engine engine/c/zchezz_v500 \
            --dst-engine engine/c/zchezz_vx48x32 \
            --weights "artifacts/exact48-${{ matrix.tag }}/weights.bin" --h1 48 --h2 32
      - name: Build candidate, opponent and arena
        run: |
          make -C engine/build ENGINE=vx48x32 clean native
          make -C engine/build ENGINE=${{ matrix.opponent }} clean native
          make -C engine/build ENGINE=v500 arena
      - name: Create common paired openings
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'train')
          import v500_pipeline as p
          p._make_gate_openings(p.ROOT/'artifacts/exact48-openings.epd', 805000, 1024)
          PY
      - name: Run gate
        run: |
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_vx48x32/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_${{ matrix.opponent }}/zchezz.exe" \
            --games ${{ matrix.games }} --threads 4 \
            --movetime ${{ matrix.movetime }} --nodes ${{ matrix.nodes }} --max-plies 300 \
            --openings artifacts/exact48-openings.epd --opening-plies 0 \
            --seed ${{ matrix.seed }} --tt-mb 16 \
            --json "artifacts/exact48-${{ matrix.tag }}/result.json"
      - name: Summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/exact48-${{ matrix.tag }}/result.json')
          if not p.exists():
              print('RESULT MISSING'); raise SystemExit(0)
          x=json.loads(p.read_text())['pairings'][0]
          print('=== exact48 ${{ matrix.tag }} ===')
          print(f'W/D/L={x["w"]}/{x["d"]}/{x["l"]} Elo={x["elo"]:+.2f} +/-{x["ci95"]:.2f}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v500-exact48-${{ matrix.tag }}
          path: artifacts/exact48-${{ matrix.tag }}/
          retention-days: 30
