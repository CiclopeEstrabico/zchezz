name: v320-elo-experiment

on:
  push:
    branches: ["v320-search-strength"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v320-vs-v314:
    if: github.actor == 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      STATIC_FLAG: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install opening generator dependency
        run: python -m pip install --disable-pip-version-check python-chess

      - name: Verify v3.20 lineage and VNNI source
        run: |
          set -euo pipefail
          test -d engine/c/zchezz_v320
          grep -q 'Zchezz 3.20' engine/c/zchezz_v320/main.c
          grep -q '__AVXVNNI__' engine/c/zchezz_v320/nnue.c
          cmp engine/c/zchezz_v314/nnue_weights.bin engine/c/zchezz_v320/nnue_weights.bin
          cmp engine/c/zchezz_v314/search.c engine/c/zchezz_v320/search.c
          cmp engine/c/zchezz_v314/search.h engine/c/zchezz_v320/search.h
          echo "v3.20 keeps v3.14 search policy and weights; only evaluated source/build upgrades are active"

      - name: Build stock v3.14 baseline
        run: |
          ARCH_FLAGS="-mavx2" make -C engine/build ENGINE=v314 clean native
          mkdir -p artifacts/v320
          engine/c/zchezz_v314/zchezz.exe bench 11 | tee artifacts/v320/bench_v314_stock.txt

      - name: Train PGO profile and build v3.20 with VNNI+LTO
        run: |
          set -euo pipefail
          rm -rf /tmp/zchezz-pgo
          mkdir -p /tmp/zchezz-pgo
          ARCH_FLAGS="-mavx2 -mavxvnni -march=native -mtune=native -flto -fprofile-generate=/tmp/zchezz-pgo" \
            make -C engine/build ENGINE=v320 clean native
          engine/c/zchezz_v320/zchezz.exe bench 8  >/dev/null
          engine/c/zchezz_v320/zchezz.exe bench 10 >/dev/null
          engine/c/zchezz_v320/zchezz.exe bench 12 >/dev/null
          ARCH_FLAGS="-mavx2 -mavxvnni -march=native -mtune=native -flto -fprofile-use=/tmp/zchezz-pgo -fprofile-correction -fomit-frame-pointer" \
            make -C engine/build ENGINE=v320 clean native
          engine/c/zchezz_v320/zchezz.exe bench 11 | tee artifacts/v320/bench_v320_vnni_pgo.txt

      - name: Build shared arena
        run: ARCH_FLAGS="-mavx2" make -C engine/build ENGINE=v403 arena

      - name: UCI sanity
        run: |
          set -euo pipefail
          printf 'uci\nisready\nposition startpos\ngo nodes 20000\n' | timeout 30s engine/c/zchezz_v314/zchezz.exe | tee /tmp/v314_uci.txt
          printf 'uci\nisready\nposition startpos\ngo nodes 20000\n' | timeout 30s engine/c/zchezz_v320/zchezz.exe | tee /tmp/v320_uci.txt
          grep -q 'bestmove ' /tmp/v314_uci.txt
          grep -q 'bestmove ' /tmp/v320_uci.txt
          grep -q 'Zchezz 3.20' /tmp/v320_uci.txt

      - name: Generate deterministic paired opening pool
        run: |
          python - <<'PY'
          import hashlib, random
          import chess
          from pathlib import Path
          rng = random.Random(3202026)
          out = Path('artifacts/v320/openings.epd')
          seen, rows = set(), []
          while len(rows) < 256:
              b = chess.Board()
              target = rng.randint(8, 18)
              ok = True
              for _ in range(target):
                  moves = list(b.legal_moves)
                  if not moves:
                      ok = False; break
                  quiet = [m for m in moves if not b.is_capture(m)]
                  pool = quiet if quiet and rng.random() < 0.78 else moves
                  b.push(rng.choice(pool))
                  if b.is_game_over(claim_draw=True):
                      ok = False; break
              if not ok: continue
              key = ' '.join(b.fen().split()[:4])
              if key not in seen:
                  seen.add(key); rows.append(key)
          out.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          print(f'openings={len(rows)} sha256={hashlib.sha256(out.read_bytes()).hexdigest()}')
          PY

      - name: Fixed-node policy/eval divergence probe
        run: |
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v320/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v314/zchezz.exe" \
            --games 128 --threads 4 --movetime 0 --nodes 20000 --max-plies 220 \
            --openings artifacts/v320/openings.epd --opening-plies 0 \
            --seed 3202026 --tt-mb 16 \
            --json artifacts/v320/fixed_20kn.json \
            --pgn artifacts/v320/fixed_20kn.pgn

      - name: Timed H2H screening (20 ms/move)
        run: |
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v320/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v314/zchezz.exe" \
            --games 512 --threads 4 --movetime 20 --max-plies 240 \
            --openings artifacts/v320/openings.epd --opening-plies 0 \
            --seed 3202026 --tt-mb 16 \
            --json artifacts/v320/h2h_20ms.json \
            --pgn artifacts/v320/h2h_20ms.pgn

      - name: Timed H2H confirmation (100 ms/move)
        run: |
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v320/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v314/zchezz.exe" \
            --games 192 --threads 4 --movetime 100 --max-plies 240 \
            --openings artifacts/v320/openings.epd --opening-plies 0 \
            --seed 3202026 --tt-mb 16 \
            --json artifacts/v320/h2h_100ms.json \
            --pgn artifacts/v320/h2h_100ms.pgn

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v320-vs-v314-evidence
          path: artifacts/v320/
          if-no-files-found: warn
