name: quality

on:
  push:
    branches: [main, "v*"]
  pull_request:
  workflow_dispatch:

jobs:
  repository-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python tools/check_repo.py
      - run: >-
          python -m pytest
          tests/test_agent_instructions.py
          tests/test_repository_contracts.py
          tests/test_documentation.py
          tests/test_test_runner.py
          tests/test_repo_policy.py
          tests/test_wasm_wiring.py
          tests/test_repo_paths.py
          tests/test_quality_tools.py
          -q

  native:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
      ARCH_FLAGS: -mavx2
      STATIC_FLAG: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Deterministic smoke
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < engine/ACTIVE_ENGINE)"
          BASELINE="$(python -c "import sys; sys.path.insert(0, 'utils'); from repo_paths import previous_version; print(previous_version('$VERSION'))")"
          echo "candidate=$VERSION baseline=$BASELINE cc=$CC"
          python tests/run_tests.py smoke --version "$VERSION" --baseline "$BASELINE" --keep-going
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.cc }}
          path: artifacts/tests/
          if-no-files-found: ignore

  sanitize:
    runs-on: ubuntu-24.04
    env:
      ARCH_FLAGS: -mavx2
      STATIC_FLAG: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ASan and UBSan build
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < engine/ACTIVE_ENGINE)"
          make -C engine/build ENGINE="$VERSION" sanitize
      - name: Exercise sanitized engine
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < engine/ACTIVE_ENGINE)"
          python tests/test_uci_extended.py \
            --exe "engine/c/zchezz_${VERSION}/zchezz_sanitize.exe" \
            --only T1 --only T2

  web:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[all]"
      - run: python -m playwright install --with-deps chromium
      - name: Web profile
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < engine/ACTIVE_ENGINE)"
          BASELINE="$(python -c "import sys; sys.path.insert(0, 'utils'); from repo_paths import previous_version; print(previous_version('$VERSION'))")"
          echo "candidate=$VERSION baseline=$BASELINE"
          python tests/run_tests.py web --version "$VERSION" --baseline "$BASELINE" --keep-going
      - name: Promote tested bundle to Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < engine/ACTIVE_ENGINE)"
          BUNDLE="engine/c/zchezz_${VERSION}/zchezz_bundle.html"
          test -s "$BUNDLE"
          EXPECTED="$(python -c "import sys; sys.path.insert(0, 'engine/build'); from bundle import parse_version; print(parse_version('zchezz_${VERSION}'))")"
          grep -Fq "Zchezz NNUE ${EXPECTED}" "$BUNDLE"
          cp "$BUNDLE" index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html already publishes ${VERSION}"
          else
            git commit -m "deploy(${VERSION}): publish tested browser bundle"
            git push origin HEAD:main
          fi
      - name: Upload web evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-evidence
          path: artifacts/tests/
          if-no-files-found: ignore
