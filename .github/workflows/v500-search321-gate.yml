name: v500 search321 isolated gate

on:
  workflow_dispatch:
  push:
    branches: [v500-strength]
    paths:
      - '.github/workflows/v500-search321-gate.yml'
      - 'tests/materialize_v500_search321.py'
      - 'tests/patch_uci_node_limit.py'

permissions:
  contents: read

env:
  ARCH_FLAGS: -mavx2
  STATIC_FLAG: ''

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install arena dependency
        run: python -m pip install --disable-pip-version-check python-chess
      - name: Materialize true-node baseline and search321 candidate
        run: |
          python tests/patch_uci_node_limit.py --src engine/c/zchezz_v500 --dst engine/c/zchezz_vn500
          python tests/materialize_v500_search321.py --src engine/c/zchezz_vn500 --dst engine/c/zchezz_vn500s321
      - name: Build engines
        run: |
          make -C engine/build ENGINE=vn500 clean native
          make -C engine/build ENGINE=vn500s321 clean native
      - name: Build deterministic paired openings
        run: |
          mkdir -p artifacts/search321
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'train')
          import v500_pipeline as p
          p._make_gate_openings(Path('artifacts/search321/openings.epd'),806731,128)
          PY
      - name: Search321 vs v5 at true 50k nodes
        run: |
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_vn500s321/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_vn500/zchezz.exe" \
            --games 128 --threads 4 --movetime 0 --nodes 50000 --max-plies 260 \
            --openings artifacts/search321/openings.epd --opening-plies 0 \
            --seed 806732 --tt-mb 16 --json artifacts/search321/search321_vs_v5_50k.json
      - name: Summarize
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/search321/search321_vs_v5_50k.json')
          if not p.exists():
              print('result MISSING')
          else:
              x=json.loads(p.read_text())['pairings'][0]
              print(f'W/D/L={x["w"]}/{x["d"]}/{x["l"]} Elo={x["elo"]:+.2f} +/-{x["ci95"]:.2f}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v500-search321-gate
          path: artifacts/search321/
          retention-days: 30
