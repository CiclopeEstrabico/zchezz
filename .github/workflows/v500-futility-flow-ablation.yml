name: v500-futility-flow-ablation

on:
  workflow_dispatch:
  push:
    branches: ["v500-strength"]
    paths:
      - ".github/workflows/v500-futility-flow-ablation.yml"

permissions:
  contents: read

jobs:
  ablation:
    strategy:
      fail-fast: false
      matrix:
        variant: [postfut, postfut314]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ARCH_FLAGS: -mavx2
      STATIC_FLAG: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install opening dependency
        run: python -m pip install --disable-pip-version-check python-chess

      - name: Create deterministic paired openings
        run: |
          mkdir -p artifacts/futility-flow/${{ matrix.variant }}
          python - <<'PY'
          import random, chess
          from pathlib import Path
          rng=random.Random(5315)
          rows=[]; seen=set()
          while len(rows)<192:
              b=chess.Board(); ok=True
              for _ in range(rng.randint(8,18)):
                  moves=list(b.legal_moves)
                  if not moves: ok=False; break
                  quiet=[m for m in moves if not b.is_capture(m)]
                  b.push(rng.choice(quiet if quiet and rng.random()<0.75 else moves))
                  if b.is_game_over(claim_draw=True): ok=False; break
              if not ok: continue
              key=' '.join(b.fen().split()[:4])
              if key not in seen:
                  seen.add(key); rows.append(key)
          Path('artifacts/futility-flow/openings.epd').write_text('\n'.join(rows)+'\n')
          PY

      - name: Restore exact post-make futility flow
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          rm -rf "engine/c/zchezz_${VARIANT}"
          cp -a engine/c/zchezz_v500 "engine/c/zchezz_${VARIANT}"
          python - <<'PY'
          import os
          from pathlib import Path
          v=os.environ['VARIANT']
          p=Path(f'engine/c/zchezz_{v}/search.c')
          s=p.read_text()

          marker='/* Futility pruning (pre-make, v4.02)'
          pos=s.find(marker)
          assert pos>=0, 'pre-make futility marker not found'
          ifpos=s.find('if (!in_check && is_quiet && depth>=1 && depth<=8 && legal_count>0 &&', pos)
          assert ifpos>=0, 'pre-make futility condition not found'
          s=s[:ifpos]+'if (0 && !in_check && is_quiet && depth>=1 && depth<=8 && legal_count>0 &&'+s[ifpos+len('if (!in_check && is_quiet && depth>=1 && depth<=8 && legal_count>0 &&'):]

          # Find the quiet-move gives_check block AFTER the pre-make marker,
          # then insert the v3.14 exact post-make futility test immediately
          # before check extensions. At this point board_make, legality and
          # gives_check have all run, exactly as in v3.14.
          gpos=s.find('                int gives_check = 0;', pos)
          assert gpos>=0
          cpos=s.find('                int check_ext = 0;', gpos)
          assert cpos>=0
          insert='''                /* A/B: v3.14-style post-make futility. */\n                if (!in_check && is_quiet && !gives_check && depth>=1 && depth<=8 && legal_count>1) {\n                    int fd = depth < 9 ? depth : 8;\n                    if (static_eval + g_tune.fut_mult * fd + fut_adj <= alpha) {\n                        board_unmake(b);\n                        continue;\n                    }\n                }\n\n'''
          s=s[:cpos]+insert+s[cpos:]

          if v=='postfut314':
              pairs=[
                  ('#define TUNE_FUT_MULT_DEFAULT                 91', '#define TUNE_FUT_MULT_DEFAULT                150'),
                  ('#define TUNE_FUT_IMPROVING_ADJ_DEFAULT          76', '#define TUNE_FUT_IMPROVING_ADJ_DEFAULT          50'),
              ]
              for old,new in pairs:
                  assert s.count(old)==1, (old,s.count(old))
                  s=s.replace(old,new)

          p.write_text(s)
          print('materialized',v)
          PY

      - name: Build baseline, variant and arena
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          make -C engine/build ENGINE=v500 native
          make -C engine/build ENGINE="$VARIANT" native
          make -C engine/build ENGINE=v500 arena

      - name: Fixed-node A/B
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_${VARIANT}/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v500/zchezz.exe" \
            --games 96 --threads 4 --movetime 0 --nodes 50000 --max-plies 300 \
            --openings artifacts/futility-flow/openings.epd --opening-plies 0 \
            --seed 53150 --tt-mb 16 \
            --json "artifacts/futility-flow/${VARIANT}/${VARIANT}_vs_v500_nodes.json" \
            --pgn "artifacts/futility-flow/${VARIANT}/${VARIANT}_vs_v500_nodes.pgn"

      - name: Fixed-time A/B
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_${VARIANT}/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v500/zchezz.exe" \
            --games 96 --threads 4 --movetime 100 --nodes 0 --max-plies 300 \
            --openings artifacts/futility-flow/openings.epd --opening-plies 0 \
            --seed 53151 --tt-mb 16 \
            --json "artifacts/futility-flow/${VARIANT}/${VARIANT}_vs_v500_time.json" \
            --pgn "artifacts/futility-flow/${VARIANT}/${VARIANT}_vs_v500_time.pgn"

      - name: Print result
        if: always()
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          v=os.environ['VARIANT']; root=Path('artifacts/futility-flow')/v
          for mode in ('nodes','time'):
              p=root/f'{v}_vs_v500_{mode}.json'
              if not p.exists(): print(mode,'MISSING'); continue
              x=json.loads(p.read_text())['pairings'][0]
              print(f'{v} {mode}: W/D/L={x["w"]}/{x["d"]}/{x["l"]} Elo={x["elo"]:+.2f} +/-{x["ci95"]:.2f}')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futility-flow-${{ matrix.variant }}
          path: artifacts/futility-flow/${{ matrix.variant }}/
          if-no-files-found: warn
          retention-days: 30
