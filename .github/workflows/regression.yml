name: strength-regression

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Candidate version/label, normally v403
        required: false
        default: v403
      baseline:
        description: Baseline version/label, normally v402
        required: false
        default: v402

jobs:
  instructions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Promotion-test policy
        run: |
          echo "Long strength tests are intentionally not an automatic shared-runner PR gate."
          echo "Run the regression/SPRT harness on a stable machine or self-hosted runner."
          echo "Use paired openings, reverse colors, fixed metadata, and predeclared decision bounds."
          echo "See docs/regression-testing.md."
