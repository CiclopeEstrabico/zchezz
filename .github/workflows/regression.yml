name: strength-regression

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Candidate engine path or label
        required: false
      baseline:
        description: Baseline engine path or label
        required: false

jobs:
  instructions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Long strength tests are intentionally not a PR gate on shared runners."
          echo "Use the repository regression harness on a stable machine/self-hosted runner."
          echo "Record the run manifest and PGN as described in docs/regression-testing.md."

