name: v500-node-limit-audit

on:
  push:
    branches: ["v500-strength"]
    paths:
      - ".github/workflows/v500-node-limit-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ARCH_FLAGS: -mavx2
      STATIC_FLAG: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check python-chess
      - name: Build engines
        run: |
          make -C engine/build ENGINE=v314 native
          make -C engine/build ENGINE=v500 native
      - name: Measure actual nodes consumed by go nodes 50000
        run: |
          mkdir -p artifacts/node_limit_audit
          python - <<'PY' | tee artifacts/node_limit_audit/report.txt
          import chess, random, re, subprocess, statistics
          from pathlib import Path

          rng=random.Random(570000)
          fens=[]
          while len(fens)<24:
              b=chess.Board()
              for _ in range(rng.randint(10,24)):
                  ms=list(b.legal_moves)
                  if not ms: break
                  b.push(rng.choice(ms))
              if not b.is_game_over(claim_draw=True): fens.append(b.fen())

          def measure(exe, fen):
              p=subprocess.Popen([exe],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,bufsize=1)
              def send(x): p.stdin.write(x+'\n'); p.stdin.flush()
              send('uci')
              while 'uciok' not in p.stdout.readline(): pass
              send('isready')
              while 'readyok' not in p.stdout.readline(): pass
              send('position fen '+fen)
              send('go nodes 50000')
              vals=[]
              while True:
                  line=p.stdout.readline()
                  if not line: break
                  vals += [int(x) for x in re.findall(r'\bnodes (\d+)',line)]
                  if line.startswith('bestmove'): break
              send('quit'); p.wait(timeout=5)
              return max(vals) if vals else -1

          engines={
              'v314':'engine/c/zchezz_v314/zchezz.exe',
              'v500':'engine/c/zchezz_v500/zchezz.exe',
          }
          for name,exe in engines.items():
              xs=[measure(exe,f) for f in fens]
              print(name, xs)
              print(name, 'mean', statistics.mean(xs),'median',statistics.median(xs),'min',min(xs),'max',max(xs),
                    'ratio_to_50k',statistics.mean(xs)/50000)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v500-node-limit-audit
          path: artifacts/node_limit_audit/
