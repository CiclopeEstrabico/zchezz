name: v3.24 Singular Isolated Verification

on:
  workflow_dispatch:
  push:
    branches:
      - exp/v324-singular-isolated-final

permissions:
  contents: read

env:
  STATIC_FLAG: ""

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e ".[all]"

      - name: Build baseline
        shell: bash
        run: |
          set -euo pipefail
          make -C engine/build ENGINE=v323 clean native CC=gcc ARCH_FLAGS="-mavx2" STATIC_FLAG=""
          cp engine/c/zchezz_v323/zchezz.exe /tmp/base.exe
          cp engine/c/zchezz_v323/nnue_weights.bin /tmp/nnue_weights.bin

      - name: Build isolated singular candidate
        shell: bash
        run: |
          set -euo pipefail
          python tools/v324_apply_singular_isolated.py
          git diff --check
          make -C engine/build ENGINE=v323 clean native CC=gcc ARCH_FLAGS="-mavx2" STATIC_FLAG=""
          python tests/test_perft.py --version v323 --max-depth 4
          python tests/test_uci_extended.py --version v323 --only T1 --only T2 --only T6 --only T9
          cp engine/c/zchezz_v323/zchezz.exe /tmp/isolated.exe
          git checkout -- engine/c/zchezz_v323/search.c

      - name: Build singular-off control
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('engine/c/zchezz_v323/search.c')
          s=p.read_text(encoding='utf-8')
          old='if (!in_check && depth>=7 && tte_hit && tte.depth>=depth-4 &&'
          if s.count(old)!=1: raise SystemExit(f'anchor={s.count(old)}')
          p.write_text(s.replace(old,'if (0 && !in_check && depth>=7 && tte_hit && tte.depth>=depth-4 &&',1),encoding='utf-8')
          PY
          make -C engine/build ENGINE=v323 clean native CC=gcc ARCH_FLAGS="-mavx2" STATIC_FLAG=""
          cp engine/c/zchezz_v323/zchezz.exe /tmp/off.exe
          git checkout -- engine/c/zchezz_v323/search.c

      - name: Benchmark tree and NPS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/arena_results
          python - <<'PY'
          import json,re,statistics,subprocess,time
          from pathlib import Path
          w='/tmp/nnue_weights.bin'
          ex={'base':'/tmp/base.exe','isolated':'/tmp/isolated.exe','off':'/tmp/off.exe'}
          out={}
          for name,exe in ex.items():
              samples=[]
              for _ in range(5):
                  t=time.perf_counter(); p=subprocess.run([exe,'--nnue',w,'bench','11'],capture_output=True,text=True,check=True); dt=time.perf_counter()-t
                  txt=p.stdout+p.stderr; n=int(re.search(r'Total nodes\s*:\s*(\d+)',txt).group(1)); samples.append((n,n/dt))
              out[name]={'nodes':samples[0][0],'median_nps':statistics.median(x[1] for x in samples)}
          print(json.dumps(out,indent=2)); Path('tests/arena_results/tree.json').write_text(json.dumps(out,indent=2))
          PY

      - name: Generate openings
        shell: bash
        run: |
          python - <<'PY'
          import random,chess
          from pathlib import Path
          r=random.Random(32429100); rows=[]; seen=set()
          while len(rows)<384:
              b=chess.Board(); ok=True
              for _ in range(r.randint(8,22)):
                  ms=list(b.legal_moves)
                  if not ms: ok=False; break
                  qs=[m for m in ms if not b.is_capture(m)]
                  b.push(r.choice(qs if qs and r.random()<.72 else ms))
                  if b.is_game_over(claim_draw=True): ok=False; break
              if ok:
                  k=' '.join(b.fen().split()[:4])
                  if k not in seen: seen.add(k); rows.append(k)
          Path('tests/arena_results/openings.epd').write_text('\n'.join(rows)+'\n')
          PY

      - name: Arena isolated vs baseline
        run: |
          python tests/run_arena.py --player uci:/tmp/isolated.exe --player uci:/tmp/base.exe --games 1400 --movetime 0 --nodes 512 --threads 2 --max-plies 300 --openings "$GITHUB_WORKSPACE/tests/arena_results/openings.epd" --opening-plies 0 --seed 32429101 --tt-mb 8 --json tests/arena_results/isolated-512.json --pgn tests/arena_results/isolated-512.pgn

      - name: Arena off vs baseline
        run: |
          python tests/run_arena.py --player uci:/tmp/off.exe --player uci:/tmp/base.exe --games 1400 --movetime 0 --nodes 512 --threads 2 --max-plies 300 --openings "$GITHUB_WORKSPACE/tests/arena_results/openings.epd" --opening-plies 0 --seed 32429102 --tt-mb 8 --json tests/arena_results/off-512.json --pgn tests/arena_results/off-512.pgn

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v324-singular-isolated
          path: tests/arena_results/
          if-no-files-found: warn
