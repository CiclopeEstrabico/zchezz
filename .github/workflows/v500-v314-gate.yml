name: v500-v314-serious-gate

on:
  workflow_dispatch:
  push:
    branches: ["v500-strength"]
    paths:
      - ".github/workflows/v500-v314-gate.yml"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ARCH_FLAGS: -mavx2
      STATIC_FLAG: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install opening dependency
        run: python -m pip install --disable-pip-version-check python-chess

      - name: Build v5.00, v3.14 and arena
        run: |
          make -C engine/build ENGINE=v500 native
          make -C engine/build ENGINE=v314 native
          make -C engine/build ENGINE=v500 arena

      - name: Generate deterministic paired openings
        run: |
          mkdir -p artifacts/v500-v314
          python - <<'PY'
          import hashlib, random, chess
          from pathlib import Path
          rng=random.Random(500314)
          rows=[]; seen=set()
          while len(rows)<384:
              b=chess.Board(); ok=True
              for _ in range(rng.randint(8,18)):
                  moves=list(b.legal_moves)
                  if not moves: ok=False; break
                  quiet=[m for m in moves if not b.is_capture(m)]
                  b.push(rng.choice(quiet if quiet and rng.random()<0.75 else moves))
                  if b.is_game_over(claim_draw=True): ok=False; break
              if not ok: continue
              key=' '.join(b.fen().split()[:4])
              if key not in seen:
                  seen.add(key); rows.append(key)
          out=Path('artifacts/v500-v314/openings.epd')
          out.write_text('\n'.join(rows)+'\n',encoding='utf-8')
          print('openings',len(rows),'sha256',hashlib.sha256(out.read_bytes()).hexdigest())
          PY

      - name: Fixed-node v5.00 vs v3.14
        run: |
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v500/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v314/zchezz.exe" \
            --games 256 --threads 4 --movetime 0 --nodes 50000 --max-plies 300 \
            --openings artifacts/v500-v314/openings.epd --opening-plies 0 \
            --seed 500314 --tt-mb 16 \
            --json artifacts/v500-v314/v500_vs_v314_50kn.json \
            --pgn artifacts/v500-v314/v500_vs_v314_50kn.pgn

      - name: Fixed-time v5.00 vs v3.14
        run: |
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v500/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v314/zchezz.exe" \
            --games 256 --threads 4 --movetime 100 --nodes 0 --max-plies 300 \
            --openings artifacts/v500-v314/openings.epd --opening-plies 0 \
            --seed 500315 --tt-mb 16 \
            --json artifacts/v500-v314/v500_vs_v314_100ms.json \
            --pgn artifacts/v500-v314/v500_vs_v314_100ms.pgn

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v500-v314-serious-gate
          path: artifacts/v500-v314/
          if-no-files-found: warn
