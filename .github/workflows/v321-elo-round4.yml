name: v321-elo-round4

on:
  workflow_dispatch:
  push:
    branches: [v321-search-strength]
    paths:
      - 'engine/c/zchezz_v321/**'
      - 'tools/v321_apply_round4.py'
      - '.github/workflows/v321-elo-round4.yml'

permissions:
  contents: read

jobs:
  candidate:
    name: round4-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: [nnue_l1_prefetch, attack_order]
    env:
      STATIC_FLAG: ''
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install opening generator dependency
        run: python -m pip install --disable-pip-version-check python-chess

      - name: Create isolated baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          cp -a engine/c/zchezz_v321 engine/c/zchezz_v321base
          cp -a engine/c/zchezz_v321 engine/c/zchezz_v321cand
          python tools/v321_apply_round4.py "$VARIANT" --root engine/c/zchezz_v321cand
          mkdir -p "artifacts/v321-round4/$VARIANT"
          diff -ur engine/c/zchezz_v321base engine/c/zchezz_v321cand > "artifacts/v321-round4/$VARIANT/patch.diff" || true
          test -s "artifacts/v321-round4/$VARIANT/patch.diff"

      - name: Build with CI-safe SIMD flags
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted runners used here do not expose AVX-VNNI at runtime.
          # Both sides therefore use AVX2 so the only difference is the tested source change.
          ARCH_FLAGS="-mavx2" make -C engine/build ENGINE=v321base clean native
          ARCH_FLAGS="-mavx2" make -C engine/build ENGINE=v321cand clean native
          ARCH_FLAGS="-mavx2" make -C engine/build ENGINE=v403 arena
          engine/c/zchezz_v321base/zchezz.exe bench 11 | tee "artifacts/v321-round4/$VARIANT/bench_base.txt"
          engine/c/zchezz_v321cand/zchezz.exe bench 11 | tee "artifacts/v321-round4/$VARIANT/bench_candidate.txt"

      - name: UCI sanity
        shell: bash
        run: |
          set -euo pipefail
          printf 'uci\nisready\nposition startpos\ngo nodes 20000\n' | timeout 30s engine/c/zchezz_v321base/zchezz.exe > /tmp/base.txt
          printf 'uci\nisready\nposition startpos\ngo nodes 20000\n' | timeout 30s engine/c/zchezz_v321cand/zchezz.exe > /tmp/cand.txt
          grep -q 'bestmove ' /tmp/base.txt
          grep -q 'bestmove ' /tmp/cand.txt

      - name: Generate paired openings
        shell: bash
        run: |
          python - <<'PY'
          import random
          from pathlib import Path
          import chess
          rng = random.Random(3214026)
          rows, seen = [], set()
          while len(rows) < 256:
              b = chess.Board()
              ok = True
              for _ in range(rng.randint(8,18)):
                  moves = list(b.legal_moves)
                  if not moves: ok=False; break
                  quiet = [m for m in moves if not b.is_capture(m)]
                  b.push(rng.choice(quiet if quiet and rng.random()<0.78 else moves))
                  if b.is_game_over(claim_draw=True): ok=False; break
              if not ok: continue
              k=' '.join(b.fen().split()[:4])
              if k not in seen: seen.add(k); rows.append(k)
          Path('openings_v321_r4.epd').write_text('\n'.join(rows)+'\n')
          PY

      - name: Fixed-node identity gate
        shell: bash
        run: |
          set -euo pipefail
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v321cand/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v321base/zchezz.exe" \
            --games 128 --threads 4 --movetime 0 --nodes 20000 --max-plies 220 \
            --openings openings_v321_r4.epd --opening-plies 0 --seed 3214026 --tt-mb 16 \
            --json "artifacts/v321-round4/$VARIANT/fixed_20kn.json" \
            --pgn "artifacts/v321-round4/$VARIANT/fixed_20kn.pgn"

      - name: Timed Elo
        shell: bash
        run: |
          set -euo pipefail
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v321cand/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v321base/zchezz.exe" \
            --games 1024 --threads 4 --movetime 20 --max-plies 240 \
            --openings openings_v321_r4.epd --opening-plies 0 --seed 3214026 --tt-mb 16 \
            --json "artifacts/v321-round4/$VARIANT/timed_20ms.json" \
            --pgn "artifacts/v321-round4/$VARIANT/timed_20ms.pgn"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: v321-round4-${{ matrix.variant }}-elo-evidence
          path: artifacts/v321-round4/${{ matrix.variant }}/
          if-no-files-found: error
