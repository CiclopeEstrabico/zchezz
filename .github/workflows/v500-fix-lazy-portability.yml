name: v500-fix-lazy-portability

on:
  push:
    branches: ["v500-strength"]
    paths:
      - ".github/workflows/v500-fix-lazy-portability.yml"

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STATIC_FLAG: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch scalar and WASM perspective masks
        run: |
          git apply <<'PATCH'
          diff --git a/engine/c/zchezz_v500/nnue.c b/engine/c/zchezz_v500/nnue.c
          --- a/engine/c/zchezz_v500/nnue.c
          +++ b/engine/c/zchezz_v500/nnue.c
          @@ -1,3 +1,3 @@
          PATCH
          python3 - <<'PY'
          from pathlib import Path
          p = Path('engine/c/zchezz_v500/nnue.c')
          s = p.read_text()
          s2 = s.replace(
              '        v128_t aw = wasm_v128_load(accW + o);\n        v128_t ab = wasm_v128_load(accB + o);\n        aw = wasm_i16x8_add(aw, wasm_v128_load(wRow + o));\n        ab = wasm_i16x8_add(ab, wasm_v128_load(bRow + o));\n        wasm_v128_store(accW + o, aw);\n        wasm_v128_store(accB + o, ab);',
              '        if (updW) {\n            v128_t aw = wasm_v128_load(accW + o);\n            aw = wasm_i16x8_add(aw, wasm_v128_load(wRow + o));\n            wasm_v128_store(accW + o, aw);\n        }\n        if (updB) {\n            v128_t ab = wasm_v128_load(accB + o);\n            ab = wasm_i16x8_add(ab, wasm_v128_load(bRow + o));\n            wasm_v128_store(accB + o, ab);\n        }',
              1,
          )
          s2 = s2.replace(
              '    for (int o = 0; o < NN_L1_OUT; o++) { accW[o] += wRow[o]; accB[o] += bRow[o]; }',
              '    for (int o = 0; o < NN_L1_OUT; o++) {\n        if (updW) accW[o] += wRow[o];\n        if (updB) accB[o] += bRow[o];\n    }',
              1,
          )
          s2 = s2.replace(
              '        v128_t aw = wasm_v128_load(accW + o);\n        v128_t ab = wasm_v128_load(accB + o);\n        aw = wasm_i16x8_sub(aw, wasm_v128_load(wRow + o));\n        ab = wasm_i16x8_sub(ab, wasm_v128_load(bRow + o));\n        wasm_v128_store(accW + o, aw);\n        wasm_v128_store(accB + o, ab);',
              '        if (updW) {\n            v128_t aw = wasm_v128_load(accW + o);\n            aw = wasm_i16x8_sub(aw, wasm_v128_load(wRow + o));\n            wasm_v128_store(accW + o, aw);\n        }\n        if (updB) {\n            v128_t ab = wasm_v128_load(accB + o);\n            ab = wasm_i16x8_sub(ab, wasm_v128_load(bRow + o));\n            wasm_v128_store(accB + o, ab);\n        }',
              1,
          )
          s2 = s2.replace(
              '    for (int o = 0; o < NN_L1_OUT; o++) { accW[o] -= wRow[o]; accB[o] -= bRow[o]; }',
              '    for (int o = 0; o < NN_L1_OUT; o++) {\n        if (updW) accW[o] -= wRow[o];\n        if (updB) accB[o] -= bRow[o];\n    }',
              1,
          )
          if s2 == s:
              raise SystemExit('no source changes applied')
          if s2.count('if (updW) accW[o] += wRow[o];') != 1:
              raise SystemExit('scalar add patch missing')
          if s2.count('if (updW) accW[o] -= wRow[o];') != 1:
              raise SystemExit('scalar sub patch missing')
          if s2.count('if (updW) {') < 4 or s2.count('if (updB) {') < 4:
              raise SystemExit('WASM perspective guards missing')
          p.write_text(s2)
          PY
          git diff --check
      - name: Prepare scalar and AVX2 copies
        run: |
          rm -rf engine/c/zchezz_v500scalar engine/c/zchezz_v500avx2
          cp -a engine/c/zchezz_v500 engine/c/zchezz_v500scalar
          cp -a engine/c/zchezz_v500 engine/c/zchezz_v500avx2
      - name: Scalar verification build
        run: |
          ARCH_FLAGS="-DNNUE_VERIFY_ACC" make -C engine/build ENGINE=v500scalar clean native
          engine/c/zchezz_v500scalar/zchezz.exe bench 10
      - name: AVX2 verification build
        run: |
          ARCH_FLAGS="-mavx2 -DNNUE_VERIFY_ACC" make -C engine/build ENGINE=v500avx2 clean native
          engine/c/zchezz_v500avx2/zchezz.exe bench 10
      - name: Scalar versus AVX2 deterministic parity
        run: |
          ARCH_FLAGS="" make -C engine/build ENGINE=v500scalar clean native
          ARCH_FLAGS="-mavx2" make -C engine/build ENGINE=v500avx2 clean native
          python3 - <<'PY'
          import subprocess, re
          def positions(exe, depth):
              out = subprocess.run([exe, 'bench', str(depth)], text=True, stdout=subprocess.PIPE,
                                   stderr=subprocess.STDOUT, check=True, timeout=180).stdout
              lines = [re.sub(r'\s+', ' ', x.strip()) for x in out.splitlines() if x.startswith('Position ')]
              if not lines:
                  raise SystemExit('no bench position lines: ' + exe)
              return lines
          for depth in (8, 10, 12):
              a = positions('engine/c/zchezz_v500scalar/zchezz.exe', depth)
              b = positions('engine/c/zchezz_v500avx2/zchezz.exe', depth)
              if a != b:
                  for i, (x, y) in enumerate(zip(a, b)):
                      if x != y:
                          print('first mismatch', depth, i, x, y)
                          break
                  raise SystemExit(f'scalar/AVX2 deterministic mismatch at depth {depth}')
              print(f'parity depth {depth}: {len(a)} positions identical')
          PY
      - name: Commit portability fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/c/zchezz_v500/nnue.c
          git commit -m "fix(v500): honor lazy perspective masks on scalar and WASM"
          git push origin HEAD:v500-strength
