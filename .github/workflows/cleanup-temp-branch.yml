name: cleanup temporary branch

on:
  push:
    branches: ["v500-strength"]
    paths:
      - ".github/workflows/cleanup-temp-branch.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete temporary branch
        run: git push origin --delete tmp-no || true
